<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভেক্টর লেকচার প্রেজেন্টেশন | Lumen Coaching Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-slide: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --accent: #10b981;
      --accent-gold: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-bn: 'Hind Siliguri', sans-serif;
      --font-en: 'Inter', sans-serif;
    }

    [data-theme="light"] {
      --bg-dark: #f1f5f9;
      --bg-slide: #ffffff;
      --bg-card: rgba(241, 245, 249, 0.9);
      --border: rgba(0, 0, 0, 0.1);
      --text: #0f172a;
      --text-muted: #475569;
      --primary-glow: rgba(59, 130, 246, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-bn);
      background-color: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Control Bar */
    .top-bar {
      height: 54px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1rem;
    }
    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: var(--font-bn);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-ctrl:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .slide-counter {
      font-family: var(--font-en);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }

    /* Main Deck Stage */
    .deck-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 30px;
      position: relative;
    }

    /* Slide Frame (16:9 Aspect Ratio) */
    .slide-frame {
      width: 100%;
      max-width: 1350px;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 120px);
      background: var(--bg-slide);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.35s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Slide Inner Content */
    .slide-header {
      padding: 20px 36px 16px 36px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08), transparent);
    }
    .slide-header-left h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .slide-header-left span {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
    }
    .slide-tag {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .slide-body {
      flex: 1;
      padding: 24px 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Grid Layouts inside Slides */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      flex: 1;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex: 1;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(8px);
    }
    .card h3 {
      font-size: 1.15rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card p, .card li {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
    }
    .card ul {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .highlight-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(59, 130, 246, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .formula-badge {
      background: rgba(37, 99, 235, 0.2);
      border-left: 4px solid var(--primary);
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      font-size: 1.1rem;
      text-align: center;
    }

    /* Interactive Simulator Box */
    .sim-container {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .sim-canvas {
      background: #070d19;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 480px;
      height: 280px;
    }
    .sim-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .slider-row input[type="range"] {
      accent-color: var(--primary);
      width: 100%;
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      height: 56px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .nav-btns {
      display: flex;
      gap: 10px;
    }
    .btn-nav {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-family: var(--font-bn);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-nav:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    /* Drawer Modal for Slides Overview */
    .drawer-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      padding: 40px;
      overflow-y: auto;
    }
    .drawer-modal.active { display: block; }
    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .drawer-item {
      background: var(--bg-slide);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drawer-item:hover, .drawer-item.active {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .drawer-item h4 {
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: var(--text);
    }
    .drawer-item small {
      font-size: 0.75rem;
      color: var(--primary);
      font-family: var(--font-en);
    }
  </style>
</head>
<body>

  <!-- Top Control Bar -->
  <header class="top-bar">

  <!-- Drawer Modal -->
  <div class="drawer-modal" id="drawerModal">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 24px auto;">

    </div>
    <div class="drawer-grid" id="drawerGrid"></div>
  </div>

    let currentSlide = 0;

    function renderSlide(index) {
      if (index < 0 || index >= slidesData.length) return;
      currentSlide = index;

      const slide = slidesData[index];
      const frame = document.getElementById('slideFrame');

      frame.innerHTML = `
        <div class="slide-header">
          <div class="slide-header-left">
            <span>${slide.category}</span>
            <h1>${slide.title}</h1>
          </div>
          <div class="slide-tag">${slide.tag}</div>
        </div>
        <div class="slide-body">
          ${slide.content}
        </div>
      `;

      // Update counter
      document.getElementById('slideCounter').textContent = `${index + 1} / ${slidesData.length}`;
      document.getElementById('btnPrev').disabled = (index === 0);
      document.getElementById('btnNext').disabled = (index === slidesData.length - 1);

      // Render KaTeX
      if (window.renderMathInElement) {
        renderMathInElement(frame, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });
      }

      // Initialize simulator if on slide 6
      if (slide.id === 6) {
        setTimeout(initSimulator, 50);
      }
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1);
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'Escape') {
        closeDrawer();
      }
    });

    document.getElementById('btnNext').addEventListener('click', nextSlide);
    document.getElementById('btnPrev').addEventListener('click', prevSlide);

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }
    document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

    // Theme toggle
    document.getElementById('btnToggleTheme').addEventListener('click', () => {
      const isLight = document.body.getAttribute('data-theme') === 'light';
      document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
    });

    // Drawer Modal (Slide overview)
    const drawerModal = document.getElementById('drawerModal');
    const drawerGrid = document.getElementById('drawerGrid');

    function openDrawer() {
      drawerGrid.innerHTML = '';
      slidesData.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = `drawer-item ${idx === currentSlide ? 'active' : ''}`;
        item.innerHTML = `
          <small>Slide ${idx + 1} • ${s.tag}</small>
          <h4>${s.title}</h4>
        `;
        item.onclick = () => {
          renderSlide(idx);
          closeDrawer();
        };
        drawerGrid.appendChild(item);
      });
      drawerModal.classList.add('active');
    }

    function closeDrawer() {
      drawerModal.classList.remove('active');
    }

    document.getElementById('btnOpenDrawer').addEventListener('click', openDrawer);
    document.getElementById('btnCloseDrawer').addEventListener('click', closeDrawer);
    drawerModal.addEventListener('click', (e) => {
      if (e.target === drawerModal) closeDrawer();
    });

    // Simulator Logic
    function initSimulator() {
      const canvas = document.getElementById('vectorCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const sP = document.getElementById('sliderP');
      const sQ = document.getElementById('sliderQ');
      const sA = document.getElementById('sliderAlpha');

      function draw() {
        const P = parseFloat(sP.value);
        const Q = parseFloat(sQ.value);
        const alphaDeg = parseFloat(sA.value);
        const alphaRad = (alphaDeg * Math.PI) / 180;

        document.getElementById('valP').textContent = P + ' N';
        document.getElementById('valQ').textContent = Q + ' N';
        document.getElementById('valAlpha').textContent = alphaDeg + '°';

        // Calculate Resultant R
        const R = Math.sqrt(P * P + Q * Q + 2 * P * Q * Math.cos(alphaRad));
        // Calculate Theta
        const thetaRad = Math.atan2(Q * Math.sin(alphaRad), P + Q * Math.cos(alphaRad));
        const thetaDeg = (thetaRad * 180) / Math.PI;

        document.getElementById('resR').textContent = R.toFixed(1) + ' N';
        document.getElementById('resTheta').textContent = thetaDeg.toFixed(1) + '°';

        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Origin
        const ox = 60;
        const oy = canvas.height - 60;
        const scale = 1.1;

        // Draw Axes
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ox, 20); ctx.lineTo(ox, oy); ctx.lineTo(canvas.width - 20, oy);
        ctx.stroke();

        // Parallelogram dashed lines
        const Px = ox + P * scale;
        const Py = oy;
        const Qx = ox + Q * Math.cos(alphaRad) * scale;
        const Qy = oy - Q * Math.sin(alphaRad) * scale;
        const Rx = Px + Q * Math.cos(alphaRad) * scale;
        const Ry = Qy;

        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(Px, Py); ctx.lineTo(Rx, Ry);
        ctx.moveTo(Qx, Qy); ctx.lineTo(Rx, Ry);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Vector P (Blue)
        drawArrow(ctx, ox, oy, Px, Py, '#3b82f6', 3);
        ctx.fillStyle = '#60a5fa';
        ctx.font = '14px Arial';
        ctx.fillText(`P = ${P}N`, Px / 2 + ox / 2 - 10, oy + 22);

        // Draw Vector Q (Green)
        drawArrow(ctx, ox, oy, Qx, Qy, '#10b981', 3);
        ctx.fillStyle = '#34d399';
        ctx.fillText(`Q = ${Q}N`, Qx / 2 + ox / 2 - 25, Qy / 2 + oy / 2 - 5);

        // Draw Resultant R (Gold)
        drawArrow(ctx, ox, oy, Rx, Ry, '#f59e0b', 4);
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 15px Arial';
        ctx.fillText(`R = ${R.toFixed(1)}N`, Rx + 8, Ry + 5);

        // Angle Arc for alpha
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(ox, oy, 32, -alphaRad, 0);
        ctx.stroke();
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '11px Arial';
        ctx.fillText(`α=${alphaDeg}°`, ox + 36, oy - 14);
      }

      function drawArrow(ctx, fromx, fromy, tox, toy, color, width) {
        const headlen = 10;
        const angle = Math.atan2(toy - fromy, tox - fromx);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = width;

        ctx.beginPath();
        ctx.moveTo(fromx, fromy);
        ctx.lineTo(tox, toy);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }

      sP.oninput = draw;
      sQ.oninput = draw;
      sA.oninput = draw;
      draw();
    }

    // Initial load
    window.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>
